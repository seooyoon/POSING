# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# ---------------------------------------------------------------- #
# CodeRabbit AI 설정 (포징)
# ---------------------------------------------------------------- #

# 응답 기본 언어 설정
language: "ko-KR"

# AI 페르소나 및 톤앤매너 지시 (최대 250자)
tone_instructions: >
  iOS 카메라 앱 리뷰입니다. 문제는 원인·실기기에서 생길 증상·수정 코드를 함께 제시하고,
  애플 공식 문서(AVFoundation·SwiftUI·Photos)를 근거로 추천하세요. 비판보다 개선 제안을 우선하고 칭찬은 짧고 위트 있게 쓰세요.

# ---------------------------------------------------------------- #
# 코드 리뷰 기능 세부 설정
# ---------------------------------------------------------------- #
reviews:
  profile: "chill"                  # 혼자 하는 개인 프로젝트라 사소한 지적은 줄임
  request_changes_workflow: false   # 코멘트 resolve 시 자동 Approve 처리
  high_level_summary: true          # PR 변경 사항 고수준 요약 활성화
  collapse_walkthrough: true        # 워크스루 코멘트 접기 활성화
  changed_files_summary: true       # 변경된 파일별 요약 생성
  sequence_diagrams: true           # 실행 흐름 시퀀스 다이어그램 생성
  assess_linked_issues: true        # 연결된 이슈 분석 컨텍스트 활용
  related_issues: false             # 연관 다른 이슈 링크 비활성화
  related_prs: true                 # 연관 다른 PR 링크 활성화
  suggested_labels: false           # 적절한 레이블 제안 비활성화
  auto_apply_labels: false          # 제안 레이블 자동 적용 비활성화
  suggested_reviewers: false        # 동료 리뷰어 추천 비활성화
  auto_assign_reviewers: false      # 추천 리뷰어 자동 할당 비활성화
  poem: true                        # 리뷰 요약에 위트 있는 시 포함 활성화

  # 리뷰에서 제외할 파일 (이미지·Xcode 생성물·개인 설정)
  path_filters:
    - "!**/build/**"
    - "!**/DerivedData/**"
    - "!**/xcuserdata/**"
    - "!**/*.xcodeproj/project.pbxproj"
    - "!**/*.xcassets/**"
    - "!**/*.png"
    - "!**/*.jpg"
    - "!**/*.jpeg"
    - "!**/*.heic"
    - "!**/*.cube"

  # 경로별 리뷰 지침 (CLAUDE.md 절대 규칙 기준)
  path_instructions:
    - path: "**/*.swift"
      instructions: |
        CLAUDE.md 4절 절대 규칙 기준으로 검토하세요.
        - 레이어: 포즈·MY 레이어는 SwiftUI 뷰로만 그려야 함. 캡처된 픽셀 버퍼·CGImage·CIImage·영상 프레임에 레이어를 합성하거나, 화면 스냅샷(ImageRenderer, drawHierarchy 등)으로 사진을 만들면 반드시 지적
        - 오프라인: URLSession, 원격 URL, 웹 폰트·원격 이미지, 분석 도구 등 네트워크 코드가 있으면 반드시 지적
        - 프레임워크: SwiftUI, AVFoundation, Photos, PhotosUI, CoreMotion, CoreImage, ImageIO 외 import나 외부 패키지가 있으면 지적
        - 스레드: AVCaptureSession·AVCaptureDevice 설정을 메인 스레드에서 하면 지적 (AVCam의 actor/전용 큐 구조 유지). UI 상태 변경은 @MainActor에서 하는지 확인
        - 동시성: Swift 6 데이터 경쟁, Sendable 위반, actor 경계를 넘는 비동기 호출 확인
        - 장치 설정: lockForConfiguration 후 unlockForConfiguration이 모든 경로에서 호출되는지, 지원 여부(isFocusPointOfInterestSupported 등) 확인 후 설정하는지
        - 저장: 사진은 PHPhotoLibrary에 바로 저장하고 권한은 .addOnly만 요청하는지. 앱 내부 갤러리를 만들면 지적
        - 비율 자르기: 방향(orientation)을 반영해 자르는지, EXIF·GPS 메타데이터를 유지하는지
        - 메모리: 클로저의 강한 참조 순환, 큰 이미지를 메인 스레드에서 디코딩하는 코드 지적
        - 강제 언래핑(!), try!, 빈 catch, 남아 있는 print를 지적
        - 바뀔 수 있는 기본값(투명도, 꾹 누르기 시간 등)을 하드코딩하지 말고 AppDefaults.swift를 쓰는지
        - 파일 하나가 400줄을 넘으면 나누라고 제안
        - 주석은 한국어로 짧게, 변수·함수 이름은 영어인지
    - path: "**/Info.plist"
      instructions: |
        - 카메라·마이크·사진 추가 권한 설명(NSCameraUsageDescription, NSMicrophoneUsageDescription, NSPhotoLibraryAddUsageDescription)이 한국어로 있는지 확인
        - 사진 읽기 권한(NSPhotoLibraryUsageDescription)은 필요 없는 설계이므로 추가되면 이유를 물어주세요
        - NSAppTransportSecurity 등 네트워크 관련 키가 있으면 지적
        - 세로 고정(UISupportedInterfaceOrientations = Portrait)이 유지되는지 확인
    - path: "**/*.entitlements"
      instructions: |
        무료 Personal Team으로 서명할 수 없는 권한(App Groups 외 유료 계정 전용 기능 등)이 추가되면 지적하세요.
    - path: "{CLAUDE.md,docs/**/*.md}"
      instructions: |
        문서끼리 서로 맞지 않는 내용(기본값, 버튼 동작, 단계 번호 등)이 있으면 지적하세요.
        CLAUDE.md 6절 임시 기본값과 docs의 설명이 같은지 확인하세요.
    - path: ".github/**"
      instructions: |
        README의 Git Convention(브랜치·커밋 prefix)과 템플릿 내용이 맞는지 확인하세요.

  # ---------------------------------------------------------------- #
  # 자동 리뷰 트리거 설정
  # ---------------------------------------------------------------- #
  auto_review:
    enabled: false                  # PR 코멘트 "@coderabbitai review"로 호출할 때만 리뷰
    auto_incremental_review: false  # 추가 커밋도 호출할 때만 리뷰
    drafts: false                   # Draft PR은 리뷰하지 않음
    base_branches:                  # 기본 브랜치 외에 리뷰할 대상 브랜치
      - "develop"
      - "main"

  # ---------------------------------------------------------------- #
  # 정적 분석 도구
  # ---------------------------------------------------------------- #
  tools:
    swiftlint:
      enabled: true                 # Swift 정적 분석
    gitleaks:
      enabled: true                 # 키·토큰 등 비밀값 커밋 탐지
    markdownlint:
      enabled: true                 # 문서 형식 검사
    yamllint:
      enabled: true
    actionlint:
      enabled: true                 # GitHub Actions 워크플로 검사 (추가 시)

# ---------------------------------------------------------------- #
# 채팅 기능 설정
# ---------------------------------------------------------------- #
chat:
  auto_reply: true                  # 태그하지 않아도 자동 답글 활성화

# ---------------------------------------------------------------- #
# CodeRabbit의 지식 기반(Knowledge Base) 설정
# ---------------------------------------------------------------- #
knowledge_base:
  web_search:
    enabled: true                   # 최신 애플 문서 검색 허용
  code_guidelines:
    enabled: true
    filePatterns:                   # 프로젝트 규칙 문서
      - "CLAUDE.md"
      - "docs/01_SPEC.md"
      - "docs/02_UI.md"
      - "docs/05_TECH_NOTES.md"
